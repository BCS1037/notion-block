name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Build plugin
        run: |
          npm ci
          npm run lint:store
          npm run lint
          npm run typecheck
          npm run build

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const { version } = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          if (process.env.RELEASE_TAG !== version) throw new Error("Release tag must match manifest version");
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const section = changelog.split(/(?=^## \[)/m).find(part => part.startsWith(`## [${version}]`));
          if (!section) throw new Error("Changelog section missing for release version");
          fs.writeFileSync("release-notes.md", section.trim() + "\n");
          NODE

      - name: Attest assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            main.js
            manifest.json
            styles.css
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
